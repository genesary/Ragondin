[package]
name = "rag-config"
description = "ConfigSource (LocalFile | Stream); config schema; parse → validate → compile."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Compiles a configuration into a `LogicalPipeline` (`rag-pipeline`) and speaks
# the configuration-delivery service (`rag-proto::config`). The wire/config
# format is separate from the in-memory IR and versioned independently (INV-9).
# A YAML parser is added when parsing is implemented (a later issue), not before
# there is anything to parse.
[dependencies]
rag-pipeline = { workspace = true }
rag-proto = { workspace = true }
