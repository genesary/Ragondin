[package]
name = "ragondin-server"
description = "Serving driver: ingress → Tower stack → engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The serving driver. `tower` governs the network envelope ONLY (INV-11);
# `ragondin-engine` runs the domain logic. Depending on the same engine crate as the
# harness is what makes serving/evaluation skew impossible (P1).
[dependencies]
ragondin-engine = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
