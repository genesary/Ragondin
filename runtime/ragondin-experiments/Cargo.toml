[package]
name = "ragondin-experiments"
description = "Native run store and run comparison: the experiment plane's state."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The experiment plane's own state. It depends on `ragondin-pipeline` for the
# `PipelineHash` that is the first component of run identity
# (`docs/system-architecture.md` §7.1) and for the `LogicalPipeline` shape a
# comparison reads and the walk to a run's ranking node follows; on
# `ragondin-config` for `parse_document`, the one definition of the load a
# comparison lowers two stored configurations through, whose closure is
# `ragondin-pipeline`, the YAML parser and two macro crates — no RPC or HTTP
# stack; and on
# `ragondin-types` for the `QueryId` a per-query trace is filed under; and on
# `ragondin-metrics` for the metric catalogue a comparison reads each metric's
# direction from — a plane crate like this one, whose own closure is
# `ragondin-types`. It does
# **not** depend on `ragondin-engine`: the harness is the driver that holds
# both, and it renders the engine's `ExecutionTrace` into the document this
# crate stores.
#
# ADR-13: the run store is native. No experiment-tracker client appears here,
# now or later — an export adapter writes *to* such a tracker and is still a
# separate, additive piece of the plane.
[dependencies]
ragondin-config = { workspace = true }
ragondin-metrics = { workspace = true }
ragondin-pipeline = { workspace = true }
ragondin-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true } # the on-disk format of a run record
thiserror = { workspace = true }

[features]
# The conformance suite for `RunStore` backends (`src/conformance.rs`): a
# backend's tests turn it on, and a production build of this crate does not
# carry it.
conformance = []

[[test]]
name = "run_store_conformance"
required-features = ["conformance"]
