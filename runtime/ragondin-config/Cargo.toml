[package]
name = "ragondin-config"
description = "ConfigSource (LocalFile | Stream); config schema; parse → validate → compile."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Compiles a configuration into a `LogicalPipeline` (`ragondin-pipeline`). The
# wire/config format is separate from the in-memory IR and versioned
# independently (INV-9).
#
# The load is defined once, here, over text (`src/document.rs`), and
# `ragondin-api` and `ragondin-experiments` depend on this crate for it. So the
# closure stays at `ragondin-pipeline`, the YAML parser and two macro crates:
# `ragondin-proto`, which `docs/code-architecture.md` §4.3 draws for the `Stream`
# source, would carry `tonic` and `prost` into both, and is added by the M7 work
# with the source that uses it.
#
# `serde_yaml` is supplied at this edge because `ragondin-pipeline` carries no
# format implementation (INV-4) and does no I/O (INV-3) — which is why its
# `peek_schema_version` is generic over the deserializer. It is a normal
# dependency here and a dev-dependency there, for that crate's doctest.
# `runtime/` is not `core/`, and a YAML parser is not a heavy backend, so no
# feature gate applies.
[dependencies]
ragondin-pipeline = { workspace = true }
async-trait = { workspace = true } # dyn-compatible async traits (frozen: async_trait, not RPITIT)
serde_yaml = { workspace = true }
thiserror = { workspace = true }

# Test-only. `ConfigSource::load` is async, so calling it needs an executor —
# but only a caller needs one. Keeping `tokio` out of `[dependencies]` is what
# leaves the runtime selected at the binary level (`docs/code-architecture.md`
# §11.2); `ragondin-contracts` and `ragondin-conformance` make the same split.
# The engine and the server driver do hold `tokio` outright, being the engine
# and a driver rather than a library a third party compiles against.
[dev-dependencies]
tokio = { workspace = true }
