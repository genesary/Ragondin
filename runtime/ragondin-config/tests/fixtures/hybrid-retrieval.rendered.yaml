version: 1
pipeline:
  inputs: [question]
  nodes:
    - id: dense
      component: retriever
      impl: qdrant_dense
      inputs: [question]
      params:
        top_k: 50

    - id: sparse
      component: retriever
      impl: bm25
      inputs: [question]
      params:
        top_k: 50

    - id: fuse
      component: fusion
      impl: rrf
      inputs: [dense, sparse]
      params:
        k: 60.0
