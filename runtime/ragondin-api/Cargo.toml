[package]
name = "ragondin-api"
description = "The front end's JSON API: the router, its typed errors, its response types and the traits it consumes. Internal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The crate that answers the browser (ADR-C36 § 2). INV-12: it reaches no
# crate under `engine/` or `components/`, nor `ragondin-remote`, directly or
# through any other crate — `scripts/check-invariants.py` walks the closure.
# Its workspace dependencies are therefore the experiment plane, the core and
# the benchmarks: `ragondin-experiments` for the `RunStore` trait, the run
# record, the lowering of a stored configuration and the comparison of runs; `ragondin-pipeline` for
# the `LogicalPipeline` that lowering yields, which the handlers convert into
# this crate's own graph type; and `ragondin-benchmarks` for the manifest, the
# digest-verified download and the import the `Registry` file backend
# (`src/fs/registry.rs`) is written over, and for the digests and the chunk
# derivation passage text is verified against; `ragondin-metrics` for the
# per-query and per-node scores read from a stored trace; and `ragondin-types`
# for the ids those scores are computed over. Its closure holds no engine and
# no component. `ragondin-config` is allowed by INV-12 and arrives with the
# endpoints that read it.
[dependencies]
ragondin-benchmarks = { workspace = true }
ragondin-experiments = { workspace = true }
ragondin-metrics = { workspace = true }
ragondin-pipeline = { workspace = true }
ragondin-types = { workspace = true }
async-trait = { workspace = true } # dyn-compatible async traits (frozen: async_trait, not RPITIT)
# The HTTP transport the `Registry` file backend hands to
# `ragondin-benchmarks`' digest-verified download (`src/fs/registry.rs`): the
# workspace's one client, with its entry's features and none appended. Here
# and not in `ragondin-benchmarks`, so that the harness and the binary, which
# depend on that crate and never download, carry no HTTP or TLS stack.
reqwest = { workspace = true }
axum = { workspace = true }        # the router and the Tower layers of the server's envelope (ADR-C36 § 6)
schemars = { workspace = true }    # the response types' schemas, assembled into the API description
serde = { workspace = true }
serde_json = { workspace = true }  # the JSON bodies, and the description document
# A pipeline document is parsed into `ragondin-pipeline`'s wire schema, as
# `ragondin validate` parses a file (`src/validation.rs`).
serde_yaml = { workspace = true }
# A pipeline document's etag: the SHA-256 of its bytes (`src/fs/pipelines.rs`).
sha2 = { workspace = true }
thiserror = { workspace = true }   # typed errors (ADR-C13): no anyhow in this crate
# `spawn_blocking`: `RunStore` is synchronous and its file backend blocks, so a
# handler moves the call off the async workers rather than stalling one.
tokio = { workspace = true }
# The serving envelope (INV-11): `Server` implements `tower::Service` over one
# request, so that `axum::serve` can listen with it while no route can be
# added to it. The trait itself needs no feature. The tests also use
# `ServiceExt::oneshot`, behind `util`, which is not asked for here: `axum`
# requires it of the same `tower` 0.5, and Cargo unifies the two.
tower = { workspace = true }

[dev-dependencies]
# The digests of the files a test's local server serves, for the manifest
# entries the registry tests build, come from `sha2`, a normal dependency.

[features]
# The conformance suite for `Registry` backends (`src/conformance.rs`): a
# backend's tests turn it on, and a production build of this crate does not
# carry it.
conformance = []

[[test]]
name = "registry_conformance"
required-features = ["conformance"]
