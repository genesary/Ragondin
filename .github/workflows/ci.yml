name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · test · clippy · fmt · invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the stable channel and the rustfmt + clippy
      # components; rustup honours it on first cargo invocation.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace

      # `cargo test --workspace` uses default features, and by rule no heavy
      # backend is one, so it compiles the feature-gated tests away rather than
      # running them. The step below proves such code *compiles*; this one is
      # where it is actually exercised. Feature-blind and whole-workspace on
      # purpose: naming a crate would mean every future component has to
      # remember to add itself here, and forgetting is silent.
      - name: Test (feature-gated paths)
        run: cargo test --workspace --all-features

      # Both configurations, deliberately. `--all-features` because a heavy
      # backend is never a default feature, so without it clippy is `cfg`'d out
      # of every component crate's real code. The default run stays because the
      # two cover different code — an item reachable only under
      # `#[cfg(not(feature = ...))]` is compiled away by the all-features run —
      # and no other step here denies warnings.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy, feature-gated paths (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The default build is lean by rule, so it never compiles what sits behind
      # a feature. Without this step a broken `#[cfg(feature = "remote")]` block
      # ships unnoticed. When heavy backends arrive and this gets slow, split it
      # into its own job rather than dropping it.
      - name: Feature-gated paths compile
        run: cargo check --workspace --all-features --all-targets

      # The gate below is the most important one, which is exactly why its own
      # test runs before it: a check that quietly stopped gating — a narrower
      # graph, an edge it no longer looks at — is then reported as a broken
      # check rather than as a clean repository. Its fixtures are throwaway
      # cargo workspaces built at run time, whose stand-ins for third-party
      # crates are path dependencies, so this fetches nothing.
      - name: Architecture invariant check behaves as documented
        run: python3 scripts/test-check-invariants.py

      # rustdoc's warnings are errors, in both feature configurations, for the
      # reasons the clippy pair above gives. A broken intra-doc link is the
      # same class of defect the documentation link check below guards in
      # Markdown, and `ragondin-contracts`' rustdoc is an INV-1 surface an
      # external component author reads. `--no-deps`: only this repository's
      # documentation is gated.
      - name: Documentation builds (rustdoc warnings are errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Documentation builds, feature-gated paths (rustdoc warnings are errors)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # The most important gate: the architecture invariants (INV-3, INV-4,
      # INV-5, INV-6, INV-11). Python 3 is preinstalled on ubuntu runners; the
      # check has no third-party dependency. It resolves the `--all-features`
      # graph, like the clippy and test steps above: every heavy backend sits
      # behind a feature by rule, so the lean graph holds no component crate's
      # real dependencies at all.
      - name: Architecture invariants (INV-3, INV-4, INV-5, INV-6, INV-11)
        run: python3 scripts/check-invariants.py

      # The gate below is only worth its green tick if it still scans what it
      # claims to. This runs first so that a check which quietly stopped gating
      # is reported as a broken check rather than as a clean repository. Its
      # fixtures are built at run time in a throwaway repository, so nothing it
      # exercises is tracked here.
      - name: Documentation link check behaves as documented
        run: python3 scripts/test-check-doc-links.py

      # An ADR citation that does not resolve reads as a missing decision, and an
      # agent that cannot find the record re-derives it. Same reasoning as above,
      # applied to the documentation.
      - name: Documentation links (ADR citations resolve)
        run: python3 scripts/check-doc-links.py

      # The ADR index is generated from front-matter. Letting it go stale would
      # make it a hand-maintained index with extra steps.
      - name: ADR index is current
        run: python3 scripts/gen-adr-index.py --check

      # Nothing above this line looks at what the dependency graph *contains* --
      # advisories, licences, duplicate versions, source registries. The policy
      # lives in deny.toml at the workspace root; `just check-deny` runs the same
      # four checks locally, so this does not fail for the first time on a push.
      #
      # Pinned to a full commit SHA rather than to a tag like the actions/* steps
      # above: those are GitHub's own, this one is third party, and a mutable tag
      # on a third-party action is a supply-chain hole in the one step whose
      # purpose is supply-chain hygiene. The trailing comment carries the version
      # the SHA is, which is the part a human reads. v2.1.1 bundles cargo-deny
      # 0.20.2; bump both together.
      #
      # `arguments` restates the action's own default, so that the flag this runs
      # with is readable here next to the justfile recipe it has to match, rather
      # than only in the action's action.yml.
      - name: Dependency audit (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
