name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · test · clippy · fmt · invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the stable channel and the rustfmt + clippy
      # components; rustup honours it on first cargo invocation.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The default build is lean by rule, so it never compiles what sits behind
      # a feature. Without this step a broken `#[cfg(feature = "remote")]` block
      # ships unnoticed. When heavy backends arrive and this gets slow, split it
      # into its own job rather than dropping it.
      - name: Feature-gated paths compile
        run: cargo check --workspace --all-features --all-targets

      # The most important gate: the architecture invariants (INV-3, INV-4,
      # INV-5, INV-6, INV-11). Python 3 is preinstalled on ubuntu runners; the
      # check has no third-party dependency.
      - name: Architecture invariants (INV-3, INV-4, INV-5, INV-6, INV-11)
        run: python3 scripts/check-invariants.py

      # An ADR citation that does not resolve reads as a missing decision, and an
      # agent that cannot find the record re-derives it. Same reasoning as above,
      # applied to the documentation.
      - name: Documentation links (ADR citations resolve)
        run: python3 scripts/check-doc-links.py

      # The ADR index is generated from front-matter. Letting it go stale would
      # make it a hand-maintained index with extra steps.
      - name: ADR index is current
        run: python3 scripts/gen-adr-index.py --check

      # Nothing above this line looks at what the dependency graph *contains* --
      # advisories, licences, duplicate versions, source registries. The policy
      # lives in deny.toml at the workspace root; `just check-deny` runs the same
      # four checks locally, so this does not fail for the first time on a push.
      #
      # Pinned to a full commit SHA rather than to a tag like the actions/* steps
      # above: those are GitHub's own, this one is third party, and a mutable tag
      # on a third-party action is a supply-chain hole in the one step whose
      # purpose is supply-chain hygiene. The trailing comment carries the version
      # the SHA is, which is the part a human reads. v2.1.1 bundles cargo-deny
      # 0.20.2; bump both together.
      #
      # `arguments` restates the action's own default, so that the flag this runs
      # with is readable here next to the justfile recipe it has to match, rather
      # than only in the action's action.yml.
      - name: Dependency audit (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
