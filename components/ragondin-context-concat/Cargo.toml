[package]
name = "ragondin-context-concat"
description = "Ordered concatenation under a character budget: a Local ContextBuilder component."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A component is a leaf of the dependency graph (INV-5): the contract it
# implements and the value types it moves, and nothing else in the workspace.
[dependencies]
ragondin-contracts = { workspace = true }
ragondin-types = { workspace = true }
async-trait = { workspace = true } # dyn-compatible async traits (frozen: async_trait, not RPITIT)
sha2 = { workspace = true }        # the digest `model_identity` reports over the configuration

# The suite every implementation passes, built-in or third-party (INV-7), and
# the runtime that drives it. Both are test-only: neither ships to a user of
# this component.
[dev-dependencies]
ragondin-conformance = { workspace = true }
tokio = { workspace = true }

# Concatenation is string arithmetic, so this feature gates no heavy dependency
# and buys no compile time. It exists so that every component crate names its
# implementation the same way -- one feature per backend, named after it -- and
# a feature gating nothing is on by default, as `rrf` is in
# `ragondin-fusion-rrf` (components/README.md, § Which way a feature default
# goes). ADR-C14 is the rule it follows.
[features]
default = ["concat"]
concat = []
