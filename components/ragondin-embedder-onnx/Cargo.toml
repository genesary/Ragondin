[package]
name = "ragondin-embedder-onnx"
description = "In-process embeddings via ONNX Runtime. No Python sidecar."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A component is a leaf of the dependency graph (INV-5): the contract it
# implements and the value types it moves, and nothing else in the workspace.
# Never `ragondin-engine`, never a sibling component -- including
# `ragondin-retriever-dense`, which is built *from* an `Embedder` and reaches
# this one as a trait object chosen by the composition root.
[dependencies]
ragondin-contracts = { workspace = true }
ragondin-types = { workspace = true }
async-trait = { workspace = true } # dyn-compatible async traits (frozen: async_trait, not RPITIT)
thiserror = { workspace = true }   # typed library errors (ADR-C13: never anyhow in a library)

# The two heavy backends, confined here and feature-gated (ADR-C14). They are
# one feature and not two: an ONNX graph over token ids cannot be driven without
# the tokenizer that produces them, so a build with one and not the other has
# nothing to offer.
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
ragondin-conformance = { workspace = true }
tokio = { workspace = true }

# ADR-C14: every heavy backend sits behind a feature, and the default build
# stays lean. `onnx` is NOT in `default`, so `cargo build --workspace` never
# compiles ONNX Runtime -- which is what the lean default build means for a
# workspace member, and what keeps `ort` out of every graph INV-4 guards.
# Everything this crate offers lives behind it; with the feature off the crate
# is an empty shell that still compiles.
#
# `just test-features` is what runs the tests behind it: it is whole-workspace
# and names no crate, so this one is covered without adding a recipe of its own.
[features]
default = []
onnx = ["dep:ort", "dep:tokenizers"]
