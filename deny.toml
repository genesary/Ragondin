# Dependency policy, enforced by `cargo deny` (#44).
#
# CI already ran build, test, clippy, fmt and the invariant scripts, and said
# nothing at all about what the dependency graph contains. This file is the
# missing half: which advisories, licences, duplicate versions and source
# registries this workspace accepts. It follows the repository's own standard --
# a constraint worth keeping is enforced by a command, not by attention in
# review -- so it runs from `just check-deny` locally and from the same check in
# CI.
#
# `cargo deny check` runs four independent checks. Each section below configures
# exactly one of them, in the order the tool reports them.

# ---------------------------------------------------------------------------
# graph -- which dependency graph the four checks are run against.
# ---------------------------------------------------------------------------
[graph]
# No target filter. Every platform's dependencies are audited, not only the one
# the developer happens to be sitting on: the lockfile carries the Windows and
# WASI crates whoever resolves it, and filtering here would make a local run
# disagree with CI's for reasons that have nothing to do with the change.
targets = []

# The default build is lean by rule (INV-4, and the lean-default-build rule in
# AGENTS.md), so it never resolves what sits behind a feature flag -- which is
# precisely where the heavy backends of M2 (tantivy, ONNX Runtime, candle, a
# vector-store client) will arrive. Auditing the default graph only would audit
# everything except the part that most needs it. Same reasoning as the
# "Feature-gated paths compile" step in ci.yml.
all-features = true

# ---------------------------------------------------------------------------
# advisories -- the RustSec database: security vulnerabilities, unmaintained and
# unsound crates, and crates yanked from the registry.
# ---------------------------------------------------------------------------
[advisories]
# This setting governs unmaintained advisories only. "all" reports them for
# transitive crates too, not only for the crates this workspace names in
# [workspace.dependencies]; "workspace" would stop at those. Vulnerabilities are
# checked across the whole graph whatever this is set to: RUSTSEC-2026-0258 was
# in h2, a crate nothing here names, and would have been reported under the
# narrower setting just the same. "all" because an unmaintained crate is a
# liability wherever it sits in the graph.
unmaintained = "all"

# A yanked crate is a crate its author withdrew. Treating that as an error keeps
# the lockfile installable; the tool's default is only a warning.
yanked = "deny"

# Empty, and worth keeping that way. This check found exactly one advisory on
# its first run -- RUSTSEC-2026-0258, h2 queueing empty HTTP/2 DATA frames
# without limit, reached through tonic -> hyper -> h2 -- and it was fixed by
# updating h2 rather than allowed here. An allowance is a standing exception
# that outlives whoever wrote it, so it should cost more than a lockfile bump
# does, not less. Anything added here needs a date, the reason, and the issue
# that removes it again.
ignore = []

# One thing deliberately NOT ignored, and one decision recorded rather than
# deferred again. Both are easy to re-derive wrongly, which is why they are
# written down here instead of left to whoever next reads a lockfile diff.
#
# `serde_yaml 0.9.34+deprecated` needs no allowance. Its version string
# announces that its author stopped maintaining it, but RustSec carries no
# unmaintained advisory for it, so this check has nothing to say about it --
# neither for `serde_yaml` nor for the `unsafe-libyaml` it pulls. The two
# advisories that do exist for that pair (RUSTSEC-2018-0005, RUSTSEC-2023-0075)
# are both fixed in the versions the lockfile already resolves. Note that #44
# attributes RUSTSEC-2024-0370 to `serde_yaml`; that identifier belongs to
# `proc-macro-error`, and the claim is wrong. `cargo deny check advisories`
# passing under `unmaintained = "all"`, across the whole graph, is the evidence
# that settles it either way.
#
# It is no longer a dev-dependency. #27 made it a normal dependency of
# `ragondin-config`, which is where a configuration file is parsed for real,
# and that is the issue this file asked to choose a replacement. The choice:
#
# **Keep `serde_yaml`.** Not a deferral -- the alternatives were measured, and
# none of them buys what it appears to buy.
#
#  - `serde_yaml_ng 0.10` depends on the *same* archived `unsafe-libyaml
#    0.2.11`. It forks the thin serde adapter and leaves the parser where it
#    was. Last release May 2024.
#  - `serde_norway 0.9.42` moves to `unsafe-libyaml-norway`, a maintained fork
#    of that same c2rust transpilation of libyaml -- machine-translated C,
#    `unsafe` throughout. Last release December 2024.
#
# Both are single-maintainer and neither has shipped in well over a year. So
# the trade on offer is: replace a crate with no maintainer by a fork with one
# volunteer, add a publisher to the trust chain, and keep the identical unsafe
# parser. That is a change that looks like remediation without being one, and
# the cost is not nil -- it renames roughly two dozen sites, half of them in
# `ragondin-pipeline`, which #27 puts out of scope.
#
# The threat model is what makes keeping it defensible rather than merely
# convenient. This parser reads a local configuration file supplied by the
# operator, once, at startup. It is not exposed to untrusted input: a YAML
# parser bug here is reachable by someone who already writes the configuration
# file, and M6's `Stream` source carries protobuf over gRPC, not YAML.
#
# Revisit on either trigger, and not before:
#
#  1. Untrusted YAML enters the system -- multi-tenant configuration, or a
#     configuration accepted from a source the operator does not control.
#  2. A RustSec advisory lands on `serde_yaml` or `unsafe-libyaml`. This check
#     fails the build on its own when that happens, which is the point of it.
#
# On either trigger the answer is probably not a fork. `saphyr` is pure safe
# Rust and actively released, but carries no serde adapter, so adopting it
# means writing one -- a piece of work to size deliberately, not a one-line
# swap to reach for in a hurry.
# ---------------------------------------------------------------------------
# licences -- what this workspace is allowed to redistribute.
# ---------------------------------------------------------------------------
[licenses]
# The workspace itself is Apache-2.0. The list below is the usual permissive
# set: every licence on it can be combined into an Apache-2.0 distribution
# without imposing a term on a downstream user.
#
# Four of these are what the current lockfile actually needs:
#
#   MIT            most of the graph, and one half of the near-universal
#                  "MIT OR Apache-2.0" dual licence
#   Apache-2.0     prost, sync_wrapper, and the other half of that dual licence
#   Unicode-3.0    unicode-ident, whose expression is an AND -- "(MIT OR
#                  Apache-2.0) AND Unicode-3.0" -- so this one is not optional
#   BSD-3-Clause   matchit, likewise an AND: "MIT AND BSD-3-Clause"
#
# The rest are on the list ahead of need, so that an ordinary permissive
# dependency does not fail CI at the moment it is added. They are not there
# because something uses them.
#
# MPL-2.0 is deliberately absent. It is file-level copyleft rather than
# permissive, nothing in the lockfile carries it, and adding it is a decision to
# take when a crate first needs it -- not in advance.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# The list above is a policy, not an inventory, so entries nothing currently
# uses are the normal state and must not be reported. Without this the check
# emits a warning per unused entry on every run, and a check that is noisy when
# it is happy stops being read when it is not.
unused-allowed-license = "allow"

# ---------------------------------------------------------------------------
# bans -- crates this workspace refuses, and duplicate versions of one crate.
#
# As configured, this section cannot fail the build: there is no deny list, and
# both settings below are non-blocking. It reports duplicate versions and
# nothing else. Two things would make it a gate -- a deny list, once there is a
# crate this workspace actually refuses; or `wildcards = "deny"`, which first
# needs `publish = false` on the members, and whether this workspace publishes
# to crates.io is a decision issue rather than a lint setting.
# ---------------------------------------------------------------------------
[bans]
# Warn, not deny. Several duplicates are already unavoidable here -- indexmap 1
# and 2, hashbrown 0.12 and 0.17, socket2 0.5 and 0.6, tower 0.4 and 0.5,
# windows-sys 0.52 and 0.61 -- each pulled by a different upstream crate whose
# release cadence this workspace does not control. Denying them would fail the
# build for a condition no change here can fix, which is the failure mode #44
# warns about: a check that fails on day one gets permanently ignored. Warning
# still surfaces the count in every run, which is what makes graph bloat
# visible as the heavy backends land.
multiple-versions = "warn"

# Off, and the reason is a property of this workspace rather than a preference.
# Every member crate is declared as `{ path = "..." }` with no version, which is
# a wildcard by the letter of the rule and carries none of its risk -- those
# paths resolve inside this repository. cargo-deny's escape hatch for exactly
# that case, `allow-wildcard-paths`, applies only to crates marked
# `publish = false`, and none of these are: whether this workspace publishes to
# crates.io is an open question, not something to answer as a side effect of
# adding a lint. So the choice is between thirteen errors, thirteen warnings on
# every run, or turning the check off.
#
# What that gives up is narrow: a third-party `foo = "*"` would go unreported.
# It would still have to be written into [workspace.dependencies], where
# AGENTS.md requires every version to be declared and where a reviewer reads it.
wildcards = "allow"

# ---------------------------------------------------------------------------
# sources -- where crates are allowed to come from.
# ---------------------------------------------------------------------------
[sources]
# crates.io and nothing else. A git dependency or a private registry is not
# forbidden in principle, but it is a supply-chain decision rather than a
# routine one, so it should require editing this file and explaining itself in
# the diff.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
