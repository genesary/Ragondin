[workspace]
resolver = "2"
members = [
    "core/ragondin-types",
    "core/ragondin-pipeline",
    "core/ragondin-contracts",
    "wire/ragondin-proto",
    "wire/ragondin-remote",
    "engine/ragondin-engine",
    "components/ragondin-fusion-rrf",
    "components/ragondin-store-memory",
    "eval/ragondin-metrics",
    "eval/ragondin-benchmarks",
    "eval/ragondin-harness",
    "runtime/ragondin-config",
    "runtime/ragondin-server",
    "runtime/ragondin-experiments",
    "runtime/ragondin-api",
    "components/ragondin-retriever-bm25",
    "components/ragondin-retriever-dense",
    "components/ragondin-embedder-onnx",
    "components/ragondin-reranker-onnx",
    "components/ragondin-stub",
    "components/ragondin-context-concat",
    "testkit/ragondin-conformance",
    "testkit/ragondin-generator-service",
    "bin/ragondin",
]

# Metadata shared by every member crate. A member opts in with
# `version.workspace = true`, `edition.workspace = true`, etc.
[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/genesary/Ragondin"
rust-version = "1.85"

# The single source of truth for dependency versions (AGENTS.md: "Dependency
# versions are declared only in [workspace.dependencies]"). A member crate
# references a dependency with `<name>.workspace = true` and never pins a
# version inline. Internal path dependencies live here too, so the graph is
# described in exactly one place.
[workspace.dependencies]
# --- internal crates (the dependency graph, centralized) ---
ragondin-types = { path = "core/ragondin-types" }
ragondin-pipeline = { path = "core/ragondin-pipeline" }
ragondin-contracts = { path = "core/ragondin-contracts" }
ragondin-proto = { path = "wire/ragondin-proto" }
ragondin-remote = { path = "wire/ragondin-remote" }
ragondin-engine = { path = "engine/ragondin-engine" }
ragondin-fusion-rrf = { path = "components/ragondin-fusion-rrf" }
ragondin-retriever-bm25 = { path = "components/ragondin-retriever-bm25" }
ragondin-retriever-dense = { path = "components/ragondin-retriever-dense" }
ragondin-embedder-onnx = { path = "components/ragondin-embedder-onnx" }
ragondin-reranker-onnx = { path = "components/ragondin-reranker-onnx" }
ragondin-store-memory = { path = "components/ragondin-store-memory" }
ragondin-stub = { path = "components/ragondin-stub" }
ragondin-context-concat = { path = "components/ragondin-context-concat" }
ragondin-metrics = { path = "eval/ragondin-metrics" }
ragondin-benchmarks = { path = "eval/ragondin-benchmarks" }
ragondin-harness = { path = "eval/ragondin-harness" }
ragondin-config = { path = "runtime/ragondin-config" }
ragondin-server = { path = "runtime/ragondin-server" }
ragondin-experiments = { path = "runtime/ragondin-experiments" }
ragondin-api = { path = "runtime/ragondin-api" }
ragondin-conformance = { path = "testkit/ragondin-conformance" }

# --- third-party dependencies ---
# Kept deliberately small. A heavy backend (candle, ort, a vector-store or LLM
# client) is listed here only once the component that needs it exists, and it
# reaches that component optional and feature-gated (INV-4, and the
# lean-default-build rule). `tantivy`, below, is the first to arrive. `serde` is
# the only dependency the core (`ragondin-types`) is permitted to ship; a
# test-only dev-dependency is outside INV-4 and outside that rule.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"                                 # JSONL datasets (ragondin-benchmarks); serde round-trip assertions in tests
serde_yaml = "0.9"                                 # the YAML config format: ragondin-config reads a file, ragondin-experiments a stored run's; golden fixtures in tests
csv = "1.3"                                        # delimited-file reader for BEIR qrels TSV (ragondin-benchmarks)
sha2 = "0.10"                                      # canonical logical-form hashing (ragondin-pipeline)
async-trait = "0.1"                                # dyn-compatible async traits (frozen: not RPITIT)
thiserror = "2"                                    # typed library errors
anyhow = "1"                                       # error aggregation, binaries only
# `net`, `sync` and `time` are admitted by ADR-C36 § 6 for `ragondin-api`: the
# UI server's listener, its job-state channels and its timers are named in that
# crate's own code rather than borrowed from another crate's features. They
# change nothing that resolves today — `tonic`'s transport already turns all
# three on in `Cargo.lock` — so the line only states what the API crate relies on.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = "0.5"                                      # serving envelope only (INV-11)
clap = { version = "4", features = ["derive"] }    # the CLI parser, in `bin/ragondin` and nowhere else
assert_cmd = "2"                                   # dev-only: spawns the built binary in `bin/ragondin`'s CLI tests
tonic = "0.12"                                     # gRPC transport for the wire layer
prost = "0.13"                                     # protobuf messages for the wire layer
tonic-build = "0.12"                               # build-dependency of ragondin-proto only: generates the stubs (ADR-C24)
protox = "0.8"                                     # build-dependency of ragondin-proto only: compiles the .proto, no protoc (ADR-C34)

# The UI server's router, admitted by ADR-C36 § 6 and used by `ragondin-api`
# only. The 0.7 line, because `tonic` 0.12 already resolves `axum` 0.7.9 and
# `hyper` 1 — `cargo tree -i hyper` shows one `hyper` in `Cargo.lock` with this
# entry in place, so no second server stack enters the lockfile. Moving to
# another line moves with `tonic`, and escalates. `default-features = false`,
# and three features:
#
#   - `json`: the `Json` response the endpoints return (no handler takes
#     its extractor: a body is read as bytes and parsed in the crate);
#   - `tokio` and `http1`: `axum::serve`, inside `ragondin_api::serve`, over
#     the listener `ragondin ui` binds on the loopback. They are named now,
#     in the pull request that creates the entry, because appending a
#     feature to an existing entry later is a change to every crate naming
#     it and escalates (AGENTS.md § Rules of engagement), while ADR-C36 § 6
#     leaves each entry's features to this pull request. HTTP/1.1 only: a
#     loopback server for one browser gains nothing from `http2`.
#
# The defaults it drops are the form and query extractors no endpoint reads,
# `matched-path` and `original-uri`, which no handler uses, and
# `tracing`/`tower-log`, since the crate emits no telemetry. ADR-C37 § 1
# admits `query`, for `ragondin-api`'s own `ApiQuery` extractor; it is not
# on the list yet, and is appended in the pull request that first uses it,
# where this comment names it among the features above. `form` stays off.
# `cargo tree -i hyper -e normal --all-features` still shows one `hyper`,
# reached through `axum`, `tonic` and their stack and from no core crate.
# `hyper` is on the INV-4 deny-list, so the core cannot reach this.
axum = { version = "0.7", default-features = false, features = [
    "json",
    "tokio",
    "http1",
] }
# The API description's schemas (ADR-C36 § 6), used by `ragondin-api` only.
# Default features: `derive` is what the response types use, `std` what it
# needs. No OpenAPI generator crate: the description is assembled by hand from
# these schemas.
schemars = "1"
# The UI's built assets, embedded into the binary (ADR-C36 § 6), used by
# `bin/ragondin` only, behind its `ui` feature. `default-features = false`
# (there are none today) and one feature, `debug-embed`: a debug build embeds
# the files too, instead of reading them from disk at run time, so the binary
# a test runs carries what a shipped one carries, and the release assertion
# tests the embedding.
#
# Not `interpolate-folder-path`: it pulls `shellexpand`, `dirs` and
# `option-ext`, whose MPL-2.0 is not on `deny.toml`'s allow list. The binary's
# build script writes the derive, with the folder it chose — `ui/dist/`, or a
# generated notice page — as a literal (ADR-C36 § 5: the Rust build never needs
# Node). No `mime-guess` feature: no runtime `mime_guess`, but a fixed table
# `ragondin-api` controls (`content_type_for`). (8.12's `rust-embed-impl`
# pulls `mime_guess` at build time whatever the features; 8.11's does not.)
#
# Held below 8.12 until the workspace's `sha2` moves to 0.11: 8.12's
# `rust-embed-utils` depends on `sha2` 0.11, a second copy of the whole
# `digest` family beside the 0.10 every other crate here uses.
rust-embed = { version = "~8.11", default-features = false, features = ["debug-embed"] }

# The workspace's HTTP client, decided in ADR-C33 § 2, and today reached by two
# crates: `testkit/ragondin-generator-service`, optional, behind its `service`
# feature; and `runtime/ragondin-api`, whose `Registry` file backend fetches a
# pinned dataset snapshot through it — the transport handed to
# `ragondin-benchmarks`' digest-verified download, so that the harness and the
# binary carry no HTTP stack. `default-features = false` drops the native TLS stack, so
# TLS runs on `rustls` with `ring` and `webpki-roots`, the precedent ADR-C27
# set for `ort`; `json` is the request and response bodies. A second HTTP
# client, or a move to the 0.13 line, whose feature names differ, escalates.
# `reqwest` is on the INV-4 deny-list, so the core cannot reach it.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# The first heavy backend. It is listed here because versions are centralized
# here and nowhere else — not because the core may reach it: `tantivy` is on the
# INV-4 deny-list, and it is an optional, feature-gated dependency of exactly one
# component crate (ADR-C14). `default-features = false` turns off all five of
# tantivy's default features, and they are not all the same kind of thing:
#
#   - `mmap` is the on-disk directory, which an in-RAM index does not use;
#   - `stemmer` and `stopwords` are linguistic. Dropping them is a choice about
#     ranking, not a size saving, argued in the crate's `ARCHITECTURE.md`;
#   - `lz4-compression` and `columnar-zstd-compression` are **not** on-disk-only
#     machinery, whatever their names suggest. `lz4-compression` selects the
#     *document store* compressor: `impl Default for Compressor`
#     (tantivy `src/store/compressors.rs`) returns `Compressor::Lz4` only under
#     that feature and `Compressor::None` otherwise. The store lives in the
#     `RamDirectory` here, so turning it off means the stored text is held
#     uncompressed in memory. That is a real memory trade, recorded in the
#     crate's `ARCHITECTURE.md`, not the no-op the grouping above used to imply.
tantivy = { version = "0.26", default-features = false }

# The ONNX Runtime binding and the tokenizer that feeds it. Listed here for the
# same reason `tantivy` is — versions are centralized here and nowhere else —
# and reaching the ONNX component crates only, each optional and behind its
# own `onnx` feature (ADR-C14). `ort` is on the INV-4 deny-list, so
# the core cannot reach either of them.
#
# `default-features = false` on both, and what each re-enabled feature buys:
#
#   - `ort`: `std`, `copy-dylibs` and `api-27` are what the default set carries
#     beyond the two below. `download-binaries` fetches a prebuilt ONNX Runtime
#     for the host at *build* time; it is the runtime, never a model, and
#     `fetch-models` — the feature that would download a model — stays off.
#     `tls-rustls` rather than the default `tls-native`, so that the fetch needs
#     no system OpenSSL: `ureq` ships its own root store either way, so the
#     platform TLS stack buys nothing here and costs a build-host dependency.
#     This feature list is the workspace's, decided once in ADR-C27; a member
#     crate references the entry and adds no `ort` feature of its own.
#     `ndarray` and `tracing` are dropped: tensors are built and read through
#     `ort`'s own shape-and-slice API, and this crate emits no telemetry.
#   - `tokenizers`: the default set is `progressbar`, `onig` and `esaxx_fast`,
#     which pull `indicatif` and two C/C++ builds. `fancy-regex` replaces
#     `onig` — the crate requires one of the two and refuses to compile with
#     neither — and it is pure Rust, so nothing here needs a C toolchain.
#     `http`, the feature that would fetch a tokenizer over the network — it is
#     what enables the optional `hf-hub` dependency, which is not a feature name
#     — is not a default and stays off.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "api-27",
    "copy-dylibs",
    "download-binaries",
    "tls-rustls",
] }
tokenizers = { version = "0.23", default-features = false, features = [
    "fancy-regex",
] }
