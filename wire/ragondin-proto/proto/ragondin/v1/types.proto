// The values the component services exchange.
//
// Face 2 of the component contract (ADR-3). Each message here mirrors, field
// for field, a value in the Rust crate ragondin-types or ragondin-contracts,
// which are the source of truth; this file is maintained by hand to follow
// them (ADR-C24). An identifier newtype of ragondin-types (DocId, ChunkId,
// QueryId) is a plain string here, as it is in that crate's serialized form.
//
// A message-typed field of a request is required even though proto3 lets it
// be omitted: a request that leaves one out cannot be answered, and is
// refused as an invalid request (ADR-C24).

syntax = "proto3";

package ragondin.v1;

// A question posed to a pipeline. Mirrors ragondin_types::Query.
message Query {
  // Identifies this query within its benchmark.
  string id = 1;
  // The query text.
  string text = 2;
}

// A passage of a document: the unit that is retrieved, ranked and scored.
// Mirrors ragondin_types::Chunk.
message Chunk {
  // Identifies this chunk within its corpus.
  string id = 1;
  // The chunk's text.
  string text = 2;
  // The document this chunk was derived from.
  string document_id = 3;
}

// A chunk with the relevance score a component gave it. Mirrors
// ragondin_types::ScoredChunk.
//
// The whole chunk travels, not its id: a cross-encoder reranker scores
// query and passage text pairs, and the contract provides no corpus lookup.
message ScoredChunk {
  // The chunk that was scored. Required.
  Chunk chunk = 1;
  // Its relevance score. Higher is more relevant; the scale is the scoring
  // component's own, comparable only within one ranked list. Finite.
  float score = 2;
}

// One ranked list of scored chunks.
//
// It has no counterpart in ragondin-types: it exists because proto3 has no
// repeated repeated field, and the Fusion service takes one ranked list per
// upstream retrieval leg, where the Rust trait takes a Vec of Vecs.
message ScoredChunkList {
  // The list, sorted by descending score.
  repeated ScoredChunk chunks = 1;
}

// A dense vector representation of a text. Mirrors ragondin_types::Embedding.
message Embedding {
  // The vector's components; their count is its dimensionality. An embedder
  // returns at least one, all finite (ADR-C20).
  repeated float components = 1;
}

// A chunk together with its vector, as a vector store holds it. Mirrors
// ragondin_contracts::EmbeddedChunk.
message EmbeddedChunk {
  // The chunk itself. Required.
  Chunk chunk = 1;
  // Its vector. Required.
  Embedding embedding = 2;
}

// One chunk of a Context, named by identifier. Mirrors
// ragondin_types::ContextChunk.
//
// A context carries its provenance by identifier, never the chunk's text: the
// text is already rendered into Context.text, and carrying it twice would put
// the same bytes on the wire twice (ADR-C31 section 1).
message ContextChunk {
  // The chunk placed in the context.
  string id = 1;
  // The document that chunk was derived from.
  string document_id = 2;
  // The score the chunk carried in, on the scale of the node that scored it,
  // untouched. A context builder never assigns a score of its own. Finite.
  float score = 3;
}

// A rendered context, and the chunks it was rendered from. Mirrors
// ragondin_types::Context.
//
// It does not hold the query: the generator is handed the query separately,
// and a context that carried one could not say which query it speaks for
// (ADR-C31 section 1).
message Context {
  // The chunks rendered into text, in the order the builder placed them,
  // which makes them a ranking rather than a set. No chunk id twice.
  repeated ContextChunk chunks = 1;
  // The rendered context.
  string text = 2;
}

// A generated answer: its text, and nothing else. Mirrors
// ragondin_types::Answer.
message Answer {
  // The answer text.
  string text = 1;
}

// The identity of the model behind a component, as the component reports it.
// Mirrors ragondin_types::ModelIdentity, a newtype over a string; the field
// is named after the argument of ModelIdentity::new.
//
// Opaque: nothing on the caller's side parses it. It is stable across calls
// while nothing has changed, with no timestamp, request id or counter in it,
// and it covers every knob that decides the component's output and is not in
// the node's parameters (ADR-C31 section 4). An empty identity is not valid,
// and a caller refuses it.
message ModelIdentity {
  // The identity. Never empty.
  string identity = 1;
}
