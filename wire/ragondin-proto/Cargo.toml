[package]
name = "ragondin-proto"
description = "Protobuf messages and gRPC service stubs for remote components and config delivery."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The wire layer. `tonic` + `prost` are the gRPC/protobuf stack; `ragondin-types` is
# the source of truth the generated messages mirror. Not a core crate, so heavy
# transport dependencies are allowed here (INV-4 constrains only the core).
[dependencies]
ragondin-types = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }

# Code generation, at build time only (ADR-C34): `protox` compiles the
# hand-maintained `.proto` files to a descriptor set, and `tonic-build`
# generates the Rust stubs from it. No `protoc` is needed. Neither is linked
# into anything this crate ships.
[build-dependencies]
tonic-build = { workspace = true }
protox = { workspace = true }

# The parity tests compare the generated messages with the params structs and
# `EmbeddedChunk`, which live in the contracts crate, not in `ragondin-types`.
[dev-dependencies]
ragondin-contracts = { workspace = true }
