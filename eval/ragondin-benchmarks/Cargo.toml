[package]
name = "ragondin-benchmarks"
description = "BenchmarkAdapter and its implementations (BEIR, SQuAD v1.1), the dataset identity, and the pinned dataset manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate reads dataset files from disk, which is correct here: INV-3 (no
# I/O) names `ragondin-types` and `ragondin-pipeline` only. It stays light in
# the spirit of INV-4 — a JSON reader, a TSV reader and SHA-256 for the
# dataset and index digests (`src/identity.rs`) — nothing heavier. In
# particular no HTTP client: `datasets::download` is handed its transport, and
# the crate that downloads (`ragondin-api`) supplies it, so the harness and the
# binary, which depend on this crate, carry no HTTP or TLS stack.
#
# It depends on `ragondin-metrics` in NEITHER direction, deliberately: this
# crate owns the qrels type and hands out a `&BTreeMap<DocId, u8>` that the
# metrics functions borrow, so the two crates stay independent leaves.
[dependencies]
csv = { workspace = true }
ragondin-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }       # the dataset and index digests, and each downloaded file's
thiserror = { workspace = true }
