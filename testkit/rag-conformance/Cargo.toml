[package]
name = "rag-conformance"
description = "The conformance suite every component implementation must pass (Local or Remote)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Exercises implementations of the `rag-contracts` traits. It depends only on
# the contracts and the value types — the same surface a contributor compiles
# against — so any component (built-in or third-party, Local or Remote) plugs
# into exactly the same suite. This is what operationally enforces INV-7.
[dependencies]
rag-contracts = { workspace = true }
rag-types = { workspace = true }
