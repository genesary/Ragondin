[package]
name = "ragondin-conformance"
description = "The conformance suite every component implementation must pass (Local or Remote)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Exercises implementations of the `ragondin-contracts` traits. It depends only on
# the contracts and the value types — the same surface a contributor compiles
# against — so any component (built-in or third-party, Local or Remote) plugs
# into exactly the same suite. This is what operationally enforces INV-7.
[dependencies]
ragondin-contracts = { workspace = true }
ragondin-types = { workspace = true }
async-trait = { workspace = true } # the attribute the contract traits are declared with
thiserror = { workspace = true }   # typed library errors (ConformanceFailure)

# Test-only. The suite is `async` so that it imposes no runtime on the crates
# that call it; exercising it here does need one, and the stubs implementing the
# contract traits need the same attribute a real component uses.
[dev-dependencies]
tokio = { workspace = true }
