[package]
name = "ragondin-engine"
description = "The engine: EngineContext (registry), physical planning, executor, ExecutionTrace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# INV-5 (CI-enforced): the engine knows only traits. It depends on
# `ragondin-contracts` (the traits), the IR (`ragondin-pipeline`), the value types
# (`ragondin-types`) — and on NO crate under `components/`. A component crate
# appearing in this manifest's dependency closure fails the build.
#
# `ragondin-remote` (the gRPC wire adapter → ragondin-proto → tonic/prost) is an OPTIONAL
# dependency behind the `remote` feature, OFF by default: a retrieval-only build
# stays lean (code-architecture.md §11.6) and nothing in M2 uses a Remote
# component. Any engine code touching `ragondin-remote` must sit behind
# `#[cfg(feature = "remote")]`.
[dependencies]
ragondin-contracts = { workspace = true }
ragondin-pipeline = { workspace = true }
ragondin-types = { workspace = true }
ragondin-remote = { workspace = true, optional = true }
tokio = { workspace = true }

[features]
default = []
remote = ["dep:ragondin-remote"]
