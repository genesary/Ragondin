[package]
name = "rag-engine"
description = "The engine: EngineContext (registry), physical planning, executor, ExecutionTrace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# INV-5 (CI-enforced): the engine knows only traits. It depends on
# `rag-contracts` (the traits), the IR (`rag-pipeline`), the value types
# (`rag-types`), and the remote adapter (`rag-remote`) — and on NO crate under
# `components/`. A component crate appearing in this manifest's dependency
# closure fails the build.
[dependencies]
rag-contracts = { workspace = true }
rag-pipeline = { workspace = true }
rag-types = { workspace = true }
rag-remote = { workspace = true }
tokio = { workspace = true }
