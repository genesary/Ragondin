# Pin the toolchain to the STABLE channel. AGENTS.md: "stable Rust, never
# nightly." Pinning the channel (rather than a fixed version) keeps the build
# on the current stable release while making a nightly dependency impossible.
[toolchain]
channel = "stable"
# `rust-analyzer` is listed so an IDE picks the version matching this
# toolchain rather than the one bundled with its extension, which warns and
# degrades when the two drift apart.
components = ["rustfmt", "clippy", "rust-analyzer"]
