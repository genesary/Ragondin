[package]
name = "ragondin"
description = "The platform binary. Subcommands: bench, compare, serve, ui, validate. The composition root."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Under the `ui` feature, decides what `rust-embed` embeds — `ui/dist/` when it
# has been built, a generated notice page when not — and the build identity.
# Without the feature it does nothing (`build.rs` says why).
build = "build.rs"

[[bin]]
name = "ragondin"
path = "src/main.rs"

# The composition root: the ONLY place that knows both the engine and the
# concrete components. It may depend on anything. `anyhow` aggregates errors
# here (never in a library, INV / frozen: thiserror in libs, anyhow in bins).
[dependencies]
ragondin-engine = { workspace = true }
ragondin-server = { workspace = true }
ragondin-harness = { workspace = true }
ragondin-experiments = { workspace = true }
ragondin-config = { workspace = true }
ragondin-metrics = { workspace = true }
ragondin-benchmarks = { workspace = true }
# `validate` matches on `ValidationError::KindMismatch` to render the wiring
# report ADR-C16 calls for, so the error type is a normal dependency here and
# no longer test-only.
ragondin-pipeline = { workspace = true }
# `bench` is the composition root: it writes the constructors the registry
# stores, so it names the traits they return and the values they move. A
# component crate never sees `Params`, so this crate is where a node's
# configuration becomes a typed constructor argument (§6.3).
ragondin-contracts = { workspace = true }
ragondin-types = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

# The components this build carries. Optional to a crate, not optional to the
# product: a lean build still parses, validates and hashes a configuration
# naming any of them, and refuses to *run* it with a diagnosis — the unknown
# `impl:` that planning reports, or, for the `onnx` embedder a `dense` node
# names, the missing feature.
#
# Not optional, and not an exception to ADR-C14: RRF is rank arithmetic with no
# backend behind it, so gating it would buy no compile time and would leave the
# lean build unable to fuse two legs it can otherwise retrieve.
ragondin-fusion-rrf = { workspace = true }
# Not optional either, for RRF's reason: concatenation is string arithmetic.
ragondin-context-concat = { workspace = true }
ragondin-retriever-bm25 = { workspace = true, optional = true }
ragondin-retriever-dense = { workspace = true, optional = true }
ragondin-store-memory = { workspace = true, optional = true }
ragondin-embedder-onnx = { workspace = true, optional = true }
ragondin-reranker-onnx = { workspace = true, optional = true }
# The stub generator, behind the `stub` feature below: no production `Local`
# generator exists — a generator is `Remote` by design (ADR-C31) — so a build
# that runs a generation pipeline without an inference service needs one, and
# the CLI tests are what need that build.
ragondin-stub = { workspace = true, optional = true }
# The `Remote` adapters, and the `tonic` channel each binding is served over,
# behind the `remote` feature below: a bound component is constructed here, by
# the composition root, over a channel built here (ADR-C32 § 3).
ragondin-remote = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
# The UI server, behind the `ui` feature below (ADR-C36 § 1): the API crate,
# which builds the server and listens with it (`ragondin_api::serve`), and
# `rust-embed` for the assets it serves, handed in as data (ADR-C36 § 6). No
# `axum`: ADR-C36 § 6 keeps it to `ragondin-api`, and this crate names no HTTP
# stack at all.
ragondin-api = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
# `Launcher` is an `async_trait` trait (frozen decision), and the binary
# implements it under `ui`. Also a dev-dependency, below, for the fakes.
async-trait = { workspace = true, optional = true }

# Test-only, and deliberately so. `ragondin-stub` is the fixture component
# crate the vertical slice in `tests/` wires: `bench` registers the real
# components, and the slice registers stubs itself, because what it exists to
# show is the wiring rather than a retrieval result — components that fabricate
# their answers are what make the trace it asserts on predictable. (It is also
# an optional normal dependency, behind `stub`, for the one stub `bench` can
# register.)
# `assert_cmd` spawns the built binary for the CLI tests: a subcommand's
# contract is an exit status and what lands on stdout and stderr, and only a
# test that runs the process observes those.
[dev-dependencies]
ragondin-stub = { workspace = true }
assert_cmd = { workspace = true }
# `src/wiring.rs` reads a node's `params` out of a validated pipeline, so its
# tests need pipelines built the way the product builds them. The door
# `ragondin-config` puts in front of that lowering takes a path and a runtime;
# these tests want neither, so they parse the same YAML into the same
# `RawPipeline` and run the same `validate`. It is the format's own parser, not
# a second spelling of the configuration.
serde_yaml = { workspace = true }
# A test in `src/wiring.rs` checks the identity `bench` records for an ONNX
# component against the digests of the files it read — computed independently,
# with the crate the canonical logical-form hash already uses. `bench` itself
# digests nothing any more: each component reports its own identity.
sha2 = { workspace = true }
serde_json = { workspace = true } # the generation calibration derives its SQuAD subset and reads traces
# The fake `Remote` services the `remote` tests bind: `tonic` servers over the
# generated service traits, hosting in-test components through
# `ragondin-remote`'s conversions, as a Rust-hosted service would. Already in
# every build through `ragondin-config`.
ragondin-proto = { workspace = true }
async-trait = { workspace = true } # the fakes implement the contract traits

# Heavy backends are optional and off by default (ADR-C14): the default build
# stays lean and compiles fast. A feature per backend rather than one per
# component, because a component is only useful with what it composes — a dense
# retriever with no embedder and no store retrieves nothing, so it arrives with
# whichever feature carries an embedder: `onnx`, or `remote`.
[features]
default = []
# In-process sparse retrieval. Pulls tantivy.
bm25 = ["dep:ragondin-retriever-bm25", "ragondin-retriever-bm25/bm25"]
# In-process embeddings and cross-encoder reranking, and the dense retriever and
# in-memory store they compose into. One feature rather than four, because the
# three that are lean on their own have nothing to do without the one that is
# not: a dense retriever with no embedder retrieves nothing, and the store
# exists to be filled by one.
# Pulls ONNX Runtime and `tokenizers`.
onnx = [
    "dep:ragondin-embedder-onnx",
    "ragondin-embedder-onnx/onnx",
    "dep:ragondin-reranker-onnx",
    "ragondin-reranker-onnx/onnx",
    "dep:ragondin-retriever-dense",
    "dep:ragondin-store-memory",
]
# The stub generator, registered by `bench` as `stub_generator`: a generator
# that needs no model and no service, for tests that drive `bench` over a
# generation pipeline. Off by default — it is a fixture, not a product
# component — and it gates nothing heavy, so the reason it is a feature is
# that, and not compile time.
stub = ["dep:ragondin-stub", "ragondin-stub/stub"]
# Components bound to a service with `--remote <family>/<name>=<uri>`
# (ADR-C32 § 2, § 3): the `Remote` adapters and the `tonic` channel they speak
# over. It carries the dense retriever and the in-memory store too, because a
# build with `remote` and without `onnx` embeds the corpus through a bound
# embedder and runs a `dense` node over it (ADR-C32 § 5); both are lean.
remote = [
    "dep:ragondin-remote",
    "dep:tonic",
    "dep:ragondin-retriever-dense",
    "dep:ragondin-store-memory",
]
# `ragondin ui`: the JSON API and the UI's embedded assets on a loopback
# listener (ADR-C36 § 1). Off by default (ADR-C14): a build without it declares
# the subcommand and refuses it, naming the feature. It gates no component, so
# the capabilities it reports are the other features'. No `tokio` feature
# beyond the workspace entry's: `net` already carries the listener.
ui = ["dep:ragondin-api", "dep:rust-embed", "dep:async-trait"]
