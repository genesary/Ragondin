# Ablation: the lexical leg reranked, no dense leg, then an answer. BM25's
# `top_k` cuts `q-wren`'s passage, so the reranker never sees it and the
# question goes unanswered. The retrieval stages are
# `../../ablations/bm25-rerank.yaml`'s; the context builder and the generator
# are `../dense-only.yaml`'s.
pipeline:
  inputs: [question]
  nodes:
    - id: lexical
      component: retriever
      impl: bm25
      inputs: [question]
      params: { top_k: 3 }
    - id: reranked
      component: reranker
      impl: cross_encoder
      inputs: [question, lexical]
      params:
        top_k: 10
        model: models/cross-encoder.onnx
        tokenizer: models/tokenizer.json
    - id: prompt
      component: context_builder
      impl: concat
      inputs: [question, reranked]
      params: { budget: 2000, separator: "\n" }
    - id: answer
      component: generator
      impl: answerer
      inputs: [question, prompt]
      params:
        served_model: qwen2.5-7b-instruct
        template: "Answer from the context.\n{context}\nQuestion: {query}"
