# Ablation: the lexical leg alone, then an answer. Ranks a distractor first on
# `q-river` and never surfaces `q-wren`'s passage, so it answers neither.
# The retrieval stage is `../../ablations/bm25-only.yaml`'s; the context
# builder and the generator are `../dense-only.yaml`'s.
pipeline:
  inputs: [question]
  nodes:
    - id: lexical
      component: retriever
      impl: bm25
      inputs: [question]
      params: { top_k: 3 }
    - id: prompt
      component: context_builder
      impl: concat
      inputs: [question, lexical]
      params: { budget: 2000, separator: "\n" }
    - id: answer
      component: generator
      impl: answerer
      inputs: [question, prompt]
      params:
        served_model: qwen2.5-7b-instruct
        template: "Answer from the context.\n{context}\nQuestion: {query}"
