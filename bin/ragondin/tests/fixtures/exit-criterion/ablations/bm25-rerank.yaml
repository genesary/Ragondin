# Ablation: the lexical leg reranked, no dense leg. Loses `q-wren`, whose
# answer BM25's `top_k` cuts, so the reranker never sees it. `tests/exit_criterion.rs`
# runs it from `..`, where the model paths resolve.
pipeline:
  inputs: [question]
  nodes:
    - id: lexical
      component: retriever
      impl: bm25
      inputs: [question]
      params: { top_k: 3 }
    - id: reranked
      component: reranker
      impl: cross_encoder
      inputs: [question, lexical]
      params:
        top_k: 10
        model: models/cross-encoder.onnx
        tokenizer: models/tokenizer.json
