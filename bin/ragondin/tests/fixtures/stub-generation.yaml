# The generation fixture the vertical slice runs: a stub retrieval leg, the
# stub context builder over it, and the stub generator over that context. It
# wires `ragondin-stub`, whose components fabricate their outputs, so this
# pipeline needs no corpus, no index, no model and no inference service —
# which is what lets the slice run in plain CI.
#
# It is a *wiring* fixture. Nothing here says anything about answer quality:
# the stub generator answers with the first line of the context it is shown
# when the template places `{context}`, so what the slice asserts is that the
# retriever's first chunk reached the answer through the context.
pipeline:
  inputs: [question]
  nodes:
    # Sorted by id the nodes read `answer`, `prompt`, `search`: the reverse of
    # the order the executor runs them in, which the trace shows.
    - id: answer
      component: generator
      impl: stub_generator
      inputs: [question, prompt]
      params:
        served_model: stub-model
        template: "Answer from the context.\n{context}\nQuestion: {query}"

    - id: prompt
      component: context_builder
      impl: stub_concat
      inputs: [question, search]
      params: { budget: 2 }

    - id: search
      component: retriever
      impl: stub_retriever
      inputs: [question]
      params: { top_k: 3, label: docs }
