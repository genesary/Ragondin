[package]
name = "rag-contracts"
description = "The component contract: the traits an external contributor implements."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# INV-4 (CI-enforced): this is the crate an external contributor implements, so
# it MUST stay light — someone implementing a `Reranker` compiles only this
# crate and `rag-types`, not the whole engine. No heavy dependency here.
# A heavy dependency appearing means the abstraction is leaking: stop and raise
# it.
[dependencies]
rag-types = { workspace = true }
rag-pipeline = { workspace = true }
async-trait = { workspace = true } # dyn-compatible async traits (frozen: async_trait, not RPITIT)
thiserror = { workspace = true }   # typed component errors
